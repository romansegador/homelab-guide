# Image Updater's login to GitHub Container Registry, to list the private images' tags. It must be
# in the same namespace as the rules (argocd). The apps have their own copy, for pulling.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: registry-credentials
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: registry-credentials
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"auth":"{{ printf "%s:%s" "<YOUR_GITHUB_USER>" .token | b64enc }}"}}}
  data:
    - secretKey: token
      remoteRef:
        key: ghcr-pull-token
