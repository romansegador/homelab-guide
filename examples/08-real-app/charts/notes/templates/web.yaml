# The web page: static files served by nginx. The browser calls /api, which the Ingress sends to the API.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "notes.labels" . | nindent 4 }}
    {{- include "notes.sleepLabels" . | nindent 4 }}
spec:
  {{- if not .Values.sleep.enabled }}
  replicas: 1
  {{- end }}
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
        {{- include "notes.labels" . | nindent 8 }}
    spec:
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret.name }}
      securityContext:
        {{- include "notes.podSecurity" . | nindent 8 }}
      containers:
        - name: web
          image: {{ .Values.web.image.repository }}:{{ required "web.image.tag is required" .Values.web.image.tag }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext:
            {{- include "notes.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "notes.labels" . | nindent 4 }}
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: http
