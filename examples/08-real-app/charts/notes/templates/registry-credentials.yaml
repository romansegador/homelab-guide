# The login the cluster uses to pull the private images, built from a GitHub token in the secrets
# manager. The token's value never reaches git. ({{ "{{" }} … {{ "}}" }} is filled in by External
# Secrets, not by Helm.)
{{- with .Values.imagePullSecret }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "notes.labels" $ | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: {{ .name }}
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"auth":"{{ "{{" }} printf "%s:%s" "{{ .username }}" .token | b64enc {{ "}}" }}"}}}
  data:
    - secretKey: token
      remoteRef:
        key: {{ .secretKey }}
{{- end }}
