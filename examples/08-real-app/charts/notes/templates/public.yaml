{{- with .Values.publicHost }}
# Public access (chapter 9, optional): the same app at a public name, reached through your
# Cloudflare tunnel, behind Cloudflare Access. cloudflared connects to Traefik over HTTPS and checks
# this certificate against the name, so the hop inside the cluster is encrypted and verified too.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: notes-public
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "notes.labels" $ | nindent 4 }}
spec:
  secretName: notes-public-tls
  dnsNames:
    - {{ . }}
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: notes-public
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "notes.labels" $ | nindent 4 }}
  {{- if $.Values.sleep.enabled }}
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: {{ $.Release.Namespace }}-sablier@kubernetescrd
  {{- end }}
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - {{ . }}
      secretName: notes-public-tls
  rules:
    - host: {{ . }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
{{- end }}
