# Chapter 9: also public, through the tunnel, behind Cloudflare Access. Leave empty until then.
publicHost: ""

api:
  image:
    tag: 0.1.0
web:
  image:
    tag: 0.1.0

worker:
  replicas: 2

database:
  size: 5Gi
  backups:
    enabled: true
