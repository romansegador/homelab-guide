# Prod: the same chart with values-prod.yaml. It runs a release, and changes only when you merge a
# pull request that changes the tags in values-prod.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: notes-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Compare on the server, with the database operator's defaults filled in (as in chapter 7).
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  source:
    repoURL: <YOUR_CONFIG_REPO_URL>
    targetRevision: main
    path: charts/notes
    helm:
      releaseName: notes-prod
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: notes-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
