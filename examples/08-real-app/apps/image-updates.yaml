# Image Updater's rules, and the two credentials they use: a key that can push to your config
# repository, and a login to read the registry. Both values live in the secrets manager.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: image-updates
  namespace: argocd
spec:
  project: default
  source:
    repoURL: <YOUR_CONFIG_REPO_URL>
    targetRevision: main
    path: manifests/image-updates
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      # The ImageUpdater kind comes with the argocd-image-updater app, which may not be installed
      # yet on the first sync. ArgoCD retries until it is.
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
