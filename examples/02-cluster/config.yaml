# k3s server settings. Installed on the machine as /etc/rancher/k3s/config.yaml, read on every start.
# No secrets in this file.

# Embedded etcd instead of SQLite: built-in snapshots, and room for more server nodes later.
cluster-init: true

# Encrypt Kubernetes Secrets inside the datastore.
secrets-encryption: true

# Extra names in the API server's certificate, so kubectl can connect by name.
tls-san:
  - lab-1.home.example.com

# The admin kubeconfig on the machine is readable by root only.
write-kubeconfig-mode: "0600"

# App volumes (the built-in local-path storage) live on the data disk, not the OS disk.
default-local-storage-path: /data/local-path

# etcd snapshots: every 6 hours, compressed, the last 8 kept on the data disk (2 days). The
# scheduled VM backup copies the data disk, snapshots included, to storage off the machine.
etcd-snapshot-schedule-cron: "0 */6 * * *"
etcd-snapshot-retention: 8
etcd-snapshot-compress: true
etcd-snapshot-dir: /data/etcd-snapshots

# Optional: also upload each snapshot to an S3-compatible bucket (the last 5 are kept there).
# See "Optional: snapshots to a bucket" in the chapter. Endpoint, bucket and keys come from this
# Secret in kube-system; set no other etcd-s3 options here, or k3s ignores the Secret.
# etcd-s3: true
# etcd-s3-config-secret: k3s-etcd-snapshot-s3-config
