# One store for the whole cluster: any namespace can read secrets from this one Bitwarden project.
# The organization and project ids aren't secrets: they're useless without the access token.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: bitwarden
spec:
  provider:
    bitwardensecretsmanager:
      organizationID: <YOUR_BITWARDEN_ORGANIZATION_ID>
      projectID: <YOUR_BITWARDEN_PROJECT_ID>
      # Bitwarden's US cloud. On the EU cloud (you log in at vault.bitwarden.eu), change these two
      # lines to https://api.bitwarden.eu and https://identity.bitwarden.eu.
      apiURL: https://api.bitwarden.com
      identityURL: https://identity.bitwarden.com
      bitwardenServerSDKURL: https://bitwarden-sdk-server.external-secrets.svc.cluster.local:9998
      caProvider:
        type: Secret
        name: bitwarden-tls-certs
        namespace: external-secrets
        key: ca.crt
      auth:
        secretRef:
          credentials:
            # The machine account's access token: the one secret you put in the cluster by hand,
            # with bootstrap/add-bitwarden-token.sh.
            name: bitwarden-access-token
            namespace: external-secrets
            key: token
