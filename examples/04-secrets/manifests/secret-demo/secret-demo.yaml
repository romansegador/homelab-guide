# Git holds only the name of the secret in Bitwarden, never its value.
apiVersion: v1
kind: Namespace
metadata:
  name: secret-demo
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo
  namespace: secret-demo
spec:
  refreshInterval: 1m        # check Bitwarden every minute; real apps can use 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: demo               # the Kubernetes Secret to create
    creationPolicy: Owner    # the Secret belongs to this ExternalSecret, and goes with it
    deletionPolicy: Retain
  data:
    - secretKey: message     # the key inside the Kubernetes Secret
      remoteRef:
        key: demo-message    # the secret's name in your Bitwarden project
