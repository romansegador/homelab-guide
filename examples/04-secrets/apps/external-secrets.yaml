# External Secrets Operator: copies secrets from Bitwarden Secrets Manager into Kubernetes Secrets.
# Bitwarden support runs as a separate small service, the Bitwarden SDK server, enabled below.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.14.0
    helm:
      valuesObject:
        bitwarden-sdk-server:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true   # the operator's CRDs are too large for a client-side apply
