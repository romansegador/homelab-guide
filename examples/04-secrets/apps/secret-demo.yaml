# A demo: one secret from Bitwarden, copied into a Kubernetes Secret. Change the value in Bitwarden
# and the Secret follows. Delete this file and push, and the demo is removed.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secret-demo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: <YOUR_CONFIG_REPO_URL>
    targetRevision: main
    path: manifests/secret-demo
  destination:
    server: https://kubernetes.default.svc
    namespace: secret-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
