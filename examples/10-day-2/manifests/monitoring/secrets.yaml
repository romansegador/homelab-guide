# The chat webhook alerts are sent to, stored in the secrets manager as alertmanager-slack-webhook.
# Alertmanager reads it as a file (apps/monitoring.yaml, api_url_file).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-slack
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: alertmanager-slack
  data:
    - secretKey: webhook-url
      remoteRef:
        key: alertmanager-slack-webhook
---
# Grafana's admin login: user `admin`, password stored in the secrets manager as
# grafana-admin-password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: grafana-admin
    template:
      data:
        admin-user: admin
        admin-password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: grafana-admin-password
