# A full backup every night at 03:00 (in the cluster's time zone, UTC by default), and one straight
# away when this is first created.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: demo-nightly
  namespace: demo-db
spec:
  schedule: "0 0 3 * * *"   # seconds minutes hours day month weekday
  immediate: true
  backupOwnerReference: self
  cluster:
    name: demo
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
