# The bucket's access key, copied from the secrets manager. The values live in Bitwarden under
# these names, never in git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backup-credentials
  namespace: demo-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: backup-credentials
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: db-backup-access-key-id
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: db-backup-secret-access-key
