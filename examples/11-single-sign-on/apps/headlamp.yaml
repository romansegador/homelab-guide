# Headlamp (chapter 10), now behind the login gate: only the `admins` group gets in, and Headlamp
# then works as its own service account (a cluster administrator), so there's no token to paste.
# This is only safe because the gate stands in front: never remove the annotation and keep the
# setting. If Authentik is down:
#   kubectl -n headlamp port-forward svc/headlamp 8080:80      → http://localhost:8080
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headlamp
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/headlamp
    chart: headlamp
    targetRevision: 0.46.0
    helm:
      valuesObject:
        ingress:
          enabled: true
          ingressClassName: traefik
          hosts:
            - host: headlamp.lab.home.example.com
              paths:
                - path: /
                  type: Prefix
          annotations:
            traefik.ingress.kubernetes.io/router.middlewares: authentik-authentik@kubernetescrd
        config:
          unsafeUseServiceAccountToken: true
        resources:
          requests: {cpu: 20m, memory: 64Mi}
          limits: {memory: 256Mi}
  destination:
    server: https://kubernetes.default.svc
    namespace: headlamp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
