# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
#
# Who may log in, and to what: Authentik's configuration as code. The worker applies this file on
# start and on every change, so a change of access is a commit.
#
# Not in here, on purpose: passwords and MFA devices (each person sets their own through a
# recovery link), and OIDC client secrets (the secrets manager, read with !Env).
#
# Removing an entry does NOT delete the object in Authentik: keep it and set `state: absent`.
version: 1
metadata:
  name: Homelab - access configuration
context:
  auth_host: https://auth.lab.home.example.com
entries:
  # ── Page 1: groups and people ─────────────────────────────────────────────────────────────────
  # admins: everything (superuser). family: only the apps opened to them, app by app.
  - model: authentik_core.group
    id: group-admins
    identifiers:
      name: admins
    attrs:
      is_superuser: true
  - model: authentik_core.group
    id: group-family
    identifiers:
      name: family
    attrs:
      is_superuser: false

  # `state: created`: made once, never overwritten (people change their own name and email).
  # Replace alice and bob with your own usernames.
  - model: authentik_core.user
    state: created
    identifiers:
      username: alice
    attrs:
      name: Alice
      groups:
        - !KeyOf group-admins
  - model: authentik_core.user
    state: created
    identifiers:
      username: bob
    attrs:
      name: Bob
      groups:
        - !KeyOf group-family

  # MFA is mandatory: anyone without an authenticator (an app code or a security key) must add one
  # before getting in. Upstream's default is to skip MFA when none is set up.
  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    identifiers:
      name: default-authentication-mfa-validation
    attrs:
      not_configured_action: configure
      device_classes:
        - totp
        - webauthn
      configuration_stages:
        - !Find [authentik_stages_authenticator_totp.authenticatortotpstage, [name, default-authenticator-totp-setup]]
        - !Find [authentik_stages_authenticator_webauthn.authenticatorwebauthnstage, [name, default-authenticator-webauthn-setup]]

  # The install's own admin, akadmin, is switched off once you're in (you're a superuser through
  # `admins`). Set this to true to switch it back on. Leave this entry out on the very first sync
  # if you want to log in as akadmin before enrolling yourself.
  - model: authentik_core.user
    identifiers:
      username: akadmin
    attrs:
      is_active: false

  # ── Page 2: the login gate (forward-auth) ─────────────────────────────────────────────────────
  # Each app behind the gate: a proxy provider, the application, and who may open it (a policy
  # binding per group). With bindings, only the bound groups get in.
  - model: authentik_providers_proxy.proxyprovider
    id: provider-headlamp
    identifiers:
      name: headlamp
    attrs: &forward-auth
      mode: forward_single
      external_host: https://headlamp.lab.home.example.com
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
  - model: authentik_core.application
    id: app-headlamp
    identifiers:
      slug: headlamp
    attrs:
      name: Headlamp
      provider: !KeyOf provider-headlamp
      meta_launch_url: https://headlamp.lab.home.example.com
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-headlamp
      group: !KeyOf group-admins
    attrs:
      order: 0

  - model: authentik_providers_proxy.proxyprovider
    id: provider-prometheus
    identifiers:
      name: prometheus
    attrs:
      <<: *forward-auth
      external_host: https://prometheus.lab.home.example.com
  - model: authentik_core.application
    id: app-prometheus
    identifiers:
      slug: prometheus
    attrs:
      name: Prometheus
      provider: !KeyOf provider-prometheus
      meta_launch_url: https://prometheus.lab.home.example.com
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-prometheus
      group: !KeyOf group-admins
    attrs:
      order: 0

  - model: authentik_providers_proxy.proxyprovider
    id: provider-alertmanager
    identifiers:
      name: alertmanager
    attrs:
      <<: *forward-auth
      external_host: https://alertmanager.lab.home.example.com
  - model: authentik_core.application
    id: app-alertmanager
    identifiers:
      slug: alertmanager
    attrs:
      name: Alertmanager
      provider: !KeyOf provider-alertmanager
      meta_launch_url: https://alertmanager.lab.home.example.com
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-alertmanager
      group: !KeyOf group-admins
    attrs:
      order: 0

  # The embedded outpost answers Traefik's questions. It must list every proxy provider above.
  - model: authentik_outposts.outpost
    identifiers:
      managed: goauthentik.io/outposts/embedded
    attrs:
      providers:
        - !KeyOf provider-headlamp
        - !KeyOf provider-prometheus
        - !KeyOf provider-alertmanager
      config:
        authentik_host: !Context auth_host
        authentik_host_insecure: false
        log_level: info

  # ── Page 3: app logins (OIDC) ─────────────────────────────────────────────────────────────────
  # sub_mode user_username: the `sub` claim is the username, stable if you ever reinstall. The
  # profile scope sends `groups` (group names); the apps give admin rights to `admins`.
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-grafana
    identifiers:
      name: grafana
    attrs: &oidc
      client_type: confidential
      client_id: grafana
      client_secret: !Env AK_OIDC_GRAFANA_SECRET
      redirect_uris:
        - matching_mode: strict
          url: https://grafana.lab.home.example.com/login/generic_oauth
      sub_mode: user_username
      # Since 2026.x the allowed grant types default to none.
      grant_types:
        - authorization_code
        - refresh_token
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
  - model: authentik_core.application
    id: app-grafana
    identifiers:
      slug: grafana
    attrs:
      name: Grafana
      provider: !KeyOf provider-grafana
      meta_launch_url: https://grafana.lab.home.example.com
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-grafana
      group: !KeyOf group-admins
    attrs:
      order: 0

  - model: authentik_providers_oauth2.oauth2provider
    id: provider-argocd
    identifiers:
      name: argocd
    attrs:
      <<: *oidc
      client_id: argocd
      client_secret: !Env AK_OIDC_ARGOCD_SECRET
      redirect_uris:
        - matching_mode: strict
          url: https://argocd.lab.home.example.com/auth/callback
        # `argocd login --sso` from your laptop.
        - matching_mode: strict
          url: http://localhost:8085/auth/callback
  - model: authentik_core.application
    id: app-argocd
    identifiers:
      slug: argocd
    attrs:
      name: ArgoCD
      provider: !KeyOf provider-argocd
      meta_launch_url: https://argocd.lab.home.example.com
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-argocd
      group: !KeyOf group-admins
    attrs:
      order: 0

  # ── Page 4: the hypervisor's own login (OIDC) ─────────────────────────────────────────────────
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-proxmox
    identifiers:
      name: proxmox
    attrs:
      <<: *oidc
      client_id: proxmox
      client_secret: !Env AK_OIDC_PROXMOX_SECRET
      redirect_uris:
        - matching_mode: strict
          url: https://px.lab.home.example.com
        - matching_mode: strict
          url: https://proxmox.home.example.com:8006
  - model: authentik_core.application
    id: app-proxmox
    identifiers:
      slug: proxmox
    attrs:
      name: Proxmox
      provider: !KeyOf provider-proxmox
      meta_launch_url: https://px.lab.home.example.com
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-proxmox
      group: !KeyOf group-admins
    attrs:
      order: 0
