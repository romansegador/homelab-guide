# The login gate on Traefik.
#
# 1. The middleware: an app's Ingress adds the annotation
#      traefik.ingress.kubernetes.io/router.middlewares: authentik-authentik@kubernetescrd
#    and Traefik first asks Authentik's embedded outpost whether the person may in.
# 2. The outpost's own paths (/outpost.goauthentik.io/…, where the login comes back to) must reach
#    Authentik on each gated host: the Ingress below. Its path is longer than the apps' `/`, so
#    Traefik gives it priority. A new gated app = one more host here + a provider in blueprint.yaml.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik
spec:
  forwardAuth:
    address: http://authentik-server.authentik.svc.cluster.local/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    # Authentik's answers are small; without a limit Traefik warns on every request.
    maxResponseBodySize: 1048576
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: authentik-outpost
spec:
  ingressClassName: traefik
  rules:
    - host: headlamp.lab.home.example.com
      http:
        paths:
          - path: /outpost.goauthentik.io
            pathType: Prefix
            backend:
              service:
                name: authentik-server
                port:
                  name: http
    - host: prometheus.lab.home.example.com
      http:
        paths:
          - path: /outpost.goauthentik.io
            pathType: Prefix
            backend:
              service:
                name: authentik-server
                port:
                  name: http
    - host: alertmanager.lab.home.example.com
      http:
        paths:
          - path: /outpost.goauthentik.io
            pathType: Prefix
            backend:
              service:
                name: authentik-server
                port:
                  name: http
