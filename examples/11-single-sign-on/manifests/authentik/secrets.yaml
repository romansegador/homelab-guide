# Authentik's secret key (signs its cookies; never change it after the first start). You create
# it in the secrets manager as `authentik-secret-key`: a random string of 60+ characters.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-secret-key
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: authentik-secret-key
  data:
    - secretKey: secret-key
      remoteRef:
        key: authentik-secret-key
---
# Pages 3 and 4: one OIDC client secret per app. Authentik reads them (apps/authentik.yaml,
# then the blueprint with !Env), and each app reads the same entry for itself. Add each entry when you
# get to its page: Authentik's pods can't start while an entry listed here is missing.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-oidc
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: authentik-oidc
  data:
    - secretKey: grafana
      remoteRef:
        key: authentik-oidc-grafana
    - secretKey: argocd
      remoteRef:
        key: authentik-oidc-argocd
    # Page 4: the hypervisor keeps its own copy in its login settings.
    - secretKey: proxmox
      remoteRef:
        key: authentik-oidc-proxmox
