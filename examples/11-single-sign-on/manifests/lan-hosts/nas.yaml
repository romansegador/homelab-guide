# A NAS's web UI at https://nas.lab.home.example.com, same pattern as hypervisor.yaml. Set the port
# your NAS's web UI listens on (plain HTTP here: the hop stays on your network). It has its own login.
apiVersion: v1
kind: Service
metadata:
  name: nas
spec:
  type: ExternalName
  externalName: nas.home.example.com
  ports:
    - name: http
      port: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nas
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`nas.lab.home.example.com`)
      kind: Rule
      services:
        - name: nas
          port: 8080
  tls: {}
