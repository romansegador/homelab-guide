# The root Application: the only one you create by hand (kubectl apply -f bootstrap/root.yaml).
# It watches the apps/ folder, and every Application file in it becomes an app ArgoCD runs.
# Adding an app is adding a file there; removing the file removes the app.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: <YOUR_CONFIG_REPO_URL>
    targetRevision: main
    path: apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true     # a file removed from apps/ removes its Application
      selfHeal: true  # changes made by hand in the cluster are reverted to what git says
