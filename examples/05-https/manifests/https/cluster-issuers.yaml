# Two ways to ask Let's Encrypt for certificates. Both prove you own the domain with a DNS record
# (DNS-01), created through your DNS provider's API, so nothing at home has to be reachable from
# the internet.
#   letsencrypt-staging: Let's Encrypt's test service. Generous limits, but browsers don't trust
#                        its certificates. Use it until everything works.
#   letsencrypt:         the real one. Trusted everywhere, with strict limits on repeated requests.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging-account
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-dns-api-token
              key: api-token
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-account
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-dns-api-token
              key: api-token
