# Serves the static site built by Astro.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Behind Traefik, nginx doesn't know the public address. Relative redirects (for example
    # /start-here -> /start-here/) keep https:// and the real host name.
    absolute_redirect off;

    # Astro builds a 404 page; use it for missing pages.
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
